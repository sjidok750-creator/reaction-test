<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>반응속도 서바이벌</title>
<meta name="description" content="라운드마다 짧아지는 제한시간. 페이크에 속지 말 것. 몇 라운드까지 버티나 — 기록을 보내 단톡방 1등을 가리자.">
<meta property="og:title" content="반응속도 서바이벌">
<meta property="og:description" content="제한시간은 점점 짧아진다. 몇 라운드까지 버티나 — 기록을 보내고 1등을 가리자.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sjidok750-creator.github.io/reaction-test/">
<meta property="og:image" content="https://sjidok750-creator.github.io/reaction-test/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23c8ff2e%22/><text x=%2250%22 y=%2272%22 font-size=%2260%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22900%22>⚡</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overscroll-behavior:none; }
  body {
    font-family:'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background:#0b0d10; color:#f5f7f9;
    display:flex; justify-content:center;
    user-select:none; -webkit-user-select:none;
  }
  #app { width:100%; max-width:480px; height:100dvh; display:flex; flex-direction:column; padding:16px; }

  header { display:flex; align-items:baseline; justify-content:space-between; padding:4px 4px 0; }
  header h1 { font-size:1.3rem; font-weight:900; letter-spacing:-0.03em; }
  header h1 em { font-style:normal; color:#c8ff2e; }
  header .sub { font-size:0.72rem; color:#7c8590; font-weight:600; }

  #challengeBanner {
    display:none; margin-top:12px; padding:12px 16px; border-radius:16px;
    background:#15181d; font-size:0.85rem; line-height:1.6; font-weight:600;
  }
  #challengeBanner b { color:#c8ff2e; }

  .screen { flex:1; display:none; flex-direction:column; min-height:0; margin-top:12px; }
  .screen.on { display:flex; }

  /* 홈: 포스터 */
  .ticker { overflow:hidden; white-space:nowrap; border-top:1px solid #232830; border-bottom:1px solid #232830; padding:8px 0; }
  .tickerIn { display:inline-block; font-size:0.78rem; font-weight:700; color:#7c8590; animation:tick 16s linear infinite; }
  .tickerIn b.r { color:#ff4d6d; } .tickerIn b.g { color:#c8ff2e; } .tickerIn b.b { color:#4dc9ff; }
  @keyframes tick { from { transform:translateX(0); } to { transform:translateX(-50%); } }
  @media (prefers-reduced-motion: reduce){ .tickerIn { animation:none; } }
  .hero { flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 6px; min-height:0; }
  .heroL1 {
    font-size:2.6rem; font-weight:900; letter-spacing:-0.04em; line-height:1.1;
    color:transparent; -webkit-text-stroke:1.5px #f5f7f9;
  }
  .heroL2 { font-size:4.6rem; font-weight:900; letter-spacing:-0.05em; line-height:1.05; color:#c8ff2e; }
  .hook { margin-top:18px; font-size:0.92rem; color:#9aa3ad; font-weight:600; }
  .sticker {
    align-self:flex-start; margin-top:22px; padding:10px 16px; border:1.5px solid #c8ff2e; border-radius:12px;
    color:#c8ff2e; font-size:0.82rem; font-weight:800; transform:rotate(-3deg); background:rgba(200,255,46,0.06);
  }
  .startBar {
    width:100%; padding:20px; border:none; border-radius:18px; background:#c8ff2e; color:#0b0d10;
    font-size:1.15rem; font-weight:900; font-family:inherit; cursor:pointer; letter-spacing:-0.02em;
  }
  .startBar:active { transform:scale(0.985); }

  /* 게임 */
  #stage {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; cursor:pointer; border-radius:24px; background:#15181d;
    padding:24px; min-height:0; transition:background 0.06s;
  }
  #stage.waiting { background:#2b0f18; }
  #stage.ready   { background:#c8ff2e; }
  #stage.fake    { background:#0f2233; }
  #stage.early   { background:#2b2410; }
  #stage h2 { font-size:1.4rem; font-weight:800; line-height:1.5; letter-spacing:-0.02em; }
  #stage.ready h2, #stage.ready p { color:#0b0d10; }
  #stage .huge { font-size:3.4rem; font-weight:900; letter-spacing:-0.04em; }
  #stage.waiting .huge { color:#ff4d6d; }
  #stage.fake h2 { color:#4dc9ff; }
  #stage p { margin-top:12px; font-size:0.82rem; color:#9aa3ad; line-height:1.8; font-weight:500; }
  #stage.waiting p { color:#c99; }
  #stage .ms { font-variant-numeric:tabular-nums; }
  #hud { display:flex; justify-content:space-between; font-size:0.78rem; color:#7c8590; padding:10px 6px 0; min-height:1.7em; font-weight:700; font-variant-numeric:tabular-nums; }
  #hud .val { color:#c8ff2e; }

  /* 결과 */
  #result { overflow-y:auto; }
  .frame { border-radius:24px; background:#15181d; padding:24px 18px; text-align:center; }
  .tierChip {
    display:inline-block; padding:8px 18px; border-radius:999px; background:rgba(200,255,46,0.12);
    color:#c8ff2e; font-size:0.9rem; font-weight:800;
  }
  .score { font-size:3.6rem; font-weight:900; margin-top:14px; letter-spacing:-0.04em; font-variant-numeric:tabular-nums; }
  .score small { font-size:1.05rem; color:#7c8590; font-weight:700; letter-spacing:0; }
  .pct { margin-top:8px; font-size:0.9rem; color:#9aa3ad; line-height:1.7; font-weight:600; }
  .roast { margin-top:16px; font-size:0.85rem; color:#c8cfd8; line-height:1.8; font-weight:500;
    border-top:1px solid #232830; padding-top:14px; }
  #verdict { display:none; margin-top:14px; padding:14px; border-radius:16px; font-size:0.9rem; line-height:1.7; font-weight:700; }
  #verdict.win  { color:#c8ff2e; background:rgba(200,255,46,0.1); }
  #verdict.lose { color:#ff4d6d; background:rgba(255,77,109,0.1); }

  .btn {
    display:block; width:100%; margin-top:10px; padding:16px; font-size:0.95rem; font-weight:800;
    cursor:pointer; font-family:inherit; border:none; border-radius:16px; letter-spacing:-0.01em;
  }
  .btn:active { transform:scale(0.985); }
  .btn-y { background:#c8ff2e; color:#0b0d10; }
  .btn-g { background:#232830; color:#f5f7f9; }
  .btn-d { background:transparent; color:#7c8590; }
  a.crossLink { text-decoration:none; text-align:center; font-size:0.82rem; }
  #copied { display:none; margin-top:8px; font-size:0.78rem; color:#c8ff2e; text-align:center; font-weight:700; }
  #nick {
    width:100%; margin-top:14px; padding:14px; border:1.5px solid #232830; border-radius:14px;
    background:#0b0d10; color:#f5f7f9; font-size:0.9rem; font-family:inherit; outline:none;
    text-align:center; font-weight:600;
  }
  #nick::placeholder { color:#5a636e; }
  #nick:focus { border-color:#c8ff2e; }
  #nick.need { border-color:#ff4d6d; }
  #nickWarn { display:none; margin-top:6px; font-size:0.75rem; color:#ff4d6d; text-align:center; font-weight:600; }

  /* 기록 카드 오버레이 */
  #cardOverlay {
    display:none; position:fixed; inset:0; z-index:20; background:rgba(5,6,8,0.92);
    align-items:center; justify-content:center; padding:20px;
  }
  #cardOverlay.on { display:flex; }
  .cardBox { width:100%; max-width:380px; text-align:center; }
  #cardImg { width:100%; border-radius:20px; }
  .cardHint { margin-top:12px; font-size:0.78rem; color:#9aa3ad; font-weight:500; }
  footer { text-align:center; font-size:0.65rem; color:#4a525c; padding:10px 0 4px; line-height:1.7; }
  #adSlot { display:none; margin-top:10px; min-height:50px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>반응속도 <em>서바이벌</em></h1>
    <div class="sub">몇 라운드까지 버티나</div>
  </header>
  <div id="challengeBanner"><b id="chalName"></b>의 도전장 — <b id="chalScore"></b><br>이기면 자랑, 지면 조용히 재도전</div>

  <!-- 홈 -->
  <div class="screen on" id="home">
    <div class="ticker"><div class="tickerIn" id="tickerIn"></div></div>
    <div class="hero">
      <div class="heroL1">몇 라운드까지</div>
      <div class="heroL2">버티냐</div>
      <div class="hook">평균적인 인간은 3라운드에서 탈락한다</div>
      <div class="sticker" id="homeBest"></div>
    </div>
    <button class="startBar" id="startSlot">시작 →</button>
  </div>

  <!-- 게임 -->
  <div class="screen" id="game">
    <div id="stage"><div><h2 id="stageTitle"></h2><p id="stageDesc"></p></div></div>
    <div id="hud"><span id="hudLeft"></span><span id="hudRight"></span></div>
  </div>

  <!-- 결과 -->
  <div class="screen" id="result">
    <div class="frame">
      <div class="tierChip" id="tierName"></div>
      <div class="score"><span id="scoreMain"></span><small id="scoreUnit"></small></div>
      <div class="pct" id="pct"></div>
      <div class="roast" id="roast"></div>
      <div id="verdict"></div>
      <input id="nick" maxlength="10" placeholder="이름을 넣어야 자랑이 완성된다">
      <div id="nickWarn">이름부터. 누가 세운 기록인지 알려야지</div>
      <button class="btn btn-y" id="shareBtn">도전장 보내기</button>
      <button class="btn btn-g" id="bragBtn">기록 보내기</button>
      <div id="copied">복사 완료 — 단톡방에 붙여넣으면 전쟁 시작</div>
      <button class="btn btn-g" id="retryBtn">한 판 더</button>
      <button class="btn btn-d" id="homeBtn">처음으로</button>
      <a class="btn btn-d crossLink" href="https://sjidok750-creator.github.io/type-test/">반사신경은 확인했다 — 성격유형도 판정받기</a>
    </div>
    <div id="adSlot"></div>
  </div>

  <footer>기록은 이 기기에만 저장 · 백분위는 성인 터치 반응 분포 추정치</footer>

  <div id="cardOverlay">
    <div class="cardBox">
      <img id="cardImg" alt="기록 카드">
      <div class="cardHint">이미지를 길게 눌러 저장하거나 공유하세요</div>
      <button class="btn btn-d" id="cardClose">닫기</button>
    </div>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var NL=String.fromCharCode(10);
  var stage=$('stage'), stageTitle=$('stageTitle'), stageDesc=$('stageDesc');
  var screens={home:$('home'),game:$('game'),result:$('result')};
  function show(name){ for(var k in screens) screens[k].classList.toggle('on', k===name); }

  var state='idle', timer=null, deadline=null, pauseTimer=null, readyAt=0;
  var survived=0, limit=0, times=[];
  var SURV_START=600, SURV_STEP=30, SURV_MIN=180, FAKE_CHANCE=0.3;

  // 도전장 파싱
  var q=new URLSearchParams(location.search), chal=null;
  var cV=parseInt(q.get('c'),10);
  if(!isNaN(cV) && cV>0 && cV<200 && q.get('m')==='s'){
    chal={v:cV, name:(q.get('n')||'익명의 도전자').slice(0,10)};
    $('chalName').textContent=chal.name;
    $('chalScore').textContent=chal.v+'라운드 생존';
    $('challengeBanner').style.display='block';
  }

  var SURV_TIERS=[
    {min:13,name:'미쳤다',roasts:['기계가 당신을 두려워합니다.','이 기록은 좀 무섭습니다.']},
    {min:9,name:'고인물',roasts:['반사신경에 세금을 매겨야 할 수준.','친구들이 같이 하기 싫어하는 유형.']},
    {min:5,name:'좀 치는데',roasts:['나쁘지 않네요. 근데 친구는 몇 라운드일까요?','상위권이 눈앞. 한 판 더.']},
    {min:0,name:'몸 덜 풀림',roasts:['제한시간이 야속했나요? 다시 갑시다.','아직 예열 중이었을 뿐. 아마도.']}
  ];
  function survTierOf(n){for(var i=0;i<SURV_TIERS.length;i++)if(n>=SURV_TIERS[i].min)return SURV_TIERS[i];}
  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  function topPct(ms){
    var z=(ms-270)/45,t=1/(1+0.2316419*Math.abs(z)),d=0.3989423*Math.exp(-z*z/2);
    var p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
    var cdf=z>0?1-p:p; return Math.min(99,Math.max(0.1,cdf*100));
  }
  function fmtPct(p){ return p<1?p.toFixed(1):Math.round(p); }

  function store(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  function load(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function renderHomeBest(){
    var s=load('bestSurv'), a=load('bestAvg');
    $('homeBest').textContent = s ? ('내 최고 '+s+'라운드'+(a?' · 평균 '+a+'ms':'')) : '아직 기록 없음. 오늘 생긴다';
  }
  (function(){
    var seg='<b class="r">빨간불</b> 기다려&nbsp;&nbsp;→&nbsp;&nbsp;<b class="g">초록불</b> 빨리 탭&nbsp;&nbsp;→&nbsp;&nbsp;<b class="b">파란불</b> 속지 마&nbsp;&nbsp;→&nbsp;&nbsp;제한시간은 점점 짧아진다&nbsp;&nbsp;→&nbsp;&nbsp;';
    $('tickerIn').innerHTML=seg+seg;
  })();

  function survRound(){
    state='waiting'; stage.className='waiting';
    stageTitle.innerHTML='<span class="huge">기다려</span>';
    stageDesc.textContent='제한시간 '+limit+'ms 안에 눌러야 생존';
    $('hudLeft').textContent='ROUND '+(survived+1);
    $('hudRight').innerHTML='제한 <span class="val">'+limit+'ms</span>';
    var goGreen=function(){
      state='ready'; stage.className='ready';
      stageTitle.innerHTML='<span class="huge">지금!!</span>'; stageDesc.textContent='';
      readyAt=performance.now();
      deadline=setTimeout(function(){
        if(state==='ready') survDie('시간 초과. '+limit+'ms는 넘을 수 없는 벽이었다');
      }, limit+40);
    };
    var wait=800+Math.random()*1800;
    if(Math.random()<FAKE_CHANCE && wait>1300){
      timer=setTimeout(function(){
        if(state!=='waiting')return;
        state='fakeShow'; stage.className='fake';
        stageTitle.textContent='아직 아님!!';
        stageDesc.textContent='파란불에 손대면 즉시 탈락';
        timer=setTimeout(function(){
          if(state!=='fakeShow')return;
          state='waiting'; stage.className='waiting';
          stageTitle.innerHTML='<span class="huge">기다려</span>'; stageDesc.textContent='잘 참았다';
          timer=setTimeout(goGreen, 400+Math.random()*1000);
        }, 550);
      }, wait*0.5);
    } else {
      timer=setTimeout(goGreen, wait);
    }
  }

  function survDie(msg){
    clearTimeout(timer); clearTimeout(deadline); clearTimeout(pauseTimer); state='dying';
    var t=survTierOf(survived);
    var prev=parseInt(load('bestSurv'),10);
    if(isNaN(prev)||survived>prev) store('bestSurv',survived);
    var avg=null;
    if(times.length>=3){
      avg=Math.round(times.reduce(function(a,b){return a+b;},0)/times.length);
      var pa=parseInt(load('bestAvg'),10);
      if(isNaN(pa)||avg<pa) store('bestAvg',avg);
    }
    stage.className='waiting';
    stageTitle.innerHTML='<span class="huge">탈락</span>';
    stageDesc.textContent=msg;
    setTimeout(function(){ survResult(msg,t,avg); }, 1300);
  }

  function survResult(msg,t,avg){
    var pctTxt = avg ? '평균 반응 '+avg+'ms · 상위 '+fmtPct(topPct(avg))+'%' : '';
    showResult({
      tier:t.name, main:survived, unit:' 라운드 생존',
      pct:msg, cardLine:pctTxt||'서바이벌 생존 기록',
      roast:pick(t.roasts)+(pctTxt?'<br>'+pctTxt:''),
      shareV:survived,
      shareText:function(nick,url){
        return nick+', 서바이벌 '+survived+'라운드 생존 ('+t.name+')'+(avg?' · 평균 '+avg+'ms':'')+NL+'나보다 오래 버티면 인정 → '+url;
      },
      verdict: chal ? (survived>chal.v?'win':(survived<chal.v?'lose':'draw')) : null,
      verdictText: chal ? {
        win:'승리. '+survived+' vs '+chal.v+'라운드 — '+chal.name+' 제압',
        lose:'패배. '+survived+' vs '+chal.v+'라운드. 조용히 한 판 더.',
        draw:'무승부. 다시 가서 결판을 내자.'
      } : null
    });
  }

  var shareCtx=null;
  function showResult(o){
    state='done'; show('result');
    $('tierName').textContent=o.tier;
    $('scoreMain').textContent=o.main; $('scoreUnit').textContent=o.unit;
    $('pct').textContent=o.pct; $('roast').innerHTML=o.roast;
    var v=$('verdict');
    if(o.verdict){ v.style.display='block'; v.className=o.verdict==='lose'?'lose':'win'; v.innerHTML=o.verdictText[o.verdict]; }
    else v.style.display='none';
    var savedNick=load('nick'); if(savedNick)$('nick').value=savedNick;
    shareCtx=o; renderHomeBest();
  }

  function requireNick(){
    var nick=$('nick').value.trim().slice(0,10);
    if(!nick){
      $('nick').classList.add('need'); $('nickWarn').style.display='block';
      $('nick').focus();
      return null;
    }
    $('nick').classList.remove('need'); $('nickWarn').style.display='none';
    store('nick',nick);
    return nick;
  }

  function drawCard(nick,o){
    var W=1000,H=1250,c=document.createElement('canvas');c.width=W;c.height=H;
    var x=c.getContext('2d');
    var F=function(px,w){return (w||'')+' '+px+"px 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif";};
    x.fillStyle='#0b0d10';x.fillRect(0,0,W,H);
    // 라임 라운드 사각 포인트
    x.fillStyle='#c8ff2e';
    x.beginPath();x.roundRect(60,60,120,120,32);x.fill();
    x.fillStyle='#0b0d10';x.font=F(72,'900');x.textAlign='center';
    x.fillText('⚡',120,148);
    x.textAlign='left';
    x.fillStyle='#f5f7f9';x.font=F(52,'900');
    x.fillText('반응속도 서바이벌',220,138);
    x.textAlign='center';
    x.fillStyle='#7c8590';x.font=F(38,'600');
    x.fillText(nick+'의 기록',W/2,330);
    x.fillStyle='#f5f7f9';x.font=F(230,'900');
    x.fillText(o.main+'',W/2,590);
    x.fillStyle='#7c8590';x.font=F(46,'700');
    x.fillText(o.unit.trim(),W/2,670);
    // 등급 칩
    x.font=F(52,'800');
    var tw=x.measureText(o.tier).width;
    x.fillStyle='rgba(200,255,46,0.14)';
    x.beginPath();x.roundRect((W-tw)/2-44,730,tw+88,104,52);x.fill();
    x.fillStyle='#c8ff2e';
    x.fillText(o.tier,W/2,802);
    x.fillStyle='#9aa3ad';x.font=F(40,'600');
    x.fillText(o.cardLine,W/2,930);
    x.fillStyle='#f5f7f9';x.font=F(44,'800');
    x.fillText('이길 수 있으면 이겨보시지',W/2,1050);
    x.fillStyle='#4dc9ff';x.font=F(30,'600');
    x.fillText('sjidok750-creator.github.io/reaction-test',W/2,1140);
    return c;
  }
  $('bragBtn').addEventListener('click',function(){
    if(!shareCtx)return;
    var nick=requireNick(); if(!nick)return;
    var c;
    try{ c=drawCard(nick,shareCtx); }catch(e){ return; }
    c.toBlob(function(blob){
      if(!blob)return;
      var file=new File([blob],'record.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
        navigator.share({files:[file],text:'반응속도 서바이벌 — 이길 수 있으면 이겨보시지'+NL+'https://sjidok750-creator.github.io/reaction-test/'}).catch(function(){});
      }else{
        $('cardImg').src=c.toDataURL('image/png');
        $('cardOverlay').classList.add('on');
      }
    },'image/png');
  });
  $('cardClose').addEventListener('click',function(){ $('cardOverlay').classList.remove('on'); });

  $('shareBtn').addEventListener('click',function(){
    if(!shareCtx)return;
    var nick=requireNick(); if(!nick)return;
    var url=location.origin+location.pathname+'?c='+shareCtx.shareV+'&m=s&n='+encodeURIComponent(nick);
    var text=shareCtx.shareText(nick,url);
    if(navigator.share){ navigator.share({text:text}).catch(function(){}); }
    else{
      if(navigator.clipboard) navigator.clipboard.writeText(text).catch(function(){});
      var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
      ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta);
      $('copied').style.display='block';
      setTimeout(function(){ $('copied').style.display='none'; },2500);
    }
  });

  // 입력: 성공 라운드 후에는 자동 진행 (탭하면 즉시 스킵)
  stage.addEventListener('pointerdown',function(){
    if(state==='intro'){ survRound(); return; }
    if(state==='pause'){ clearTimeout(pauseTimer); survRound(); return; }
    if(state==='fakeShow'){ clearTimeout(timer); survDie('페이크에 당했다. 파란불은 함정이다'); return; }
    if(state==='waiting'){ clearTimeout(timer); survDie('너무 성급했다. 초록불이 뜨기 전이었다'); return; }
    if(state==='ready'){
      var ms=Math.round(performance.now()-readyAt);
      clearTimeout(deadline);
      if(ms<=limit){
        times.push(ms);
        survived++; limit=Math.max(SURV_MIN, limit-SURV_STEP);
        state='pause'; stage.className='';
        stageTitle.innerHTML='<span class="huge ms">'+ms+'ms</span>';
        stageDesc.textContent='생존. 다음 라운드 제한 '+limit+'ms';
        pauseTimer=setTimeout(function(){ if(state==='pause') survRound(); }, 900);
      } else {
        survDie(ms+'ms. 제한 '+limit+'ms를 넘겼다');
      }
    }
  });

  function startGame(){
    survived=0; limit=SURV_START; times=[];
    clearTimeout(timer); clearTimeout(deadline); clearTimeout(pauseTimer);
    $('hudLeft').textContent=''; $('hudRight').textContent='';
    show('game'); state='intro'; stage.className='';
    stageTitle.textContent='준비됐으면 탭';
    stageDesc.innerHTML='<b style="color:#ff4d6d">빨간불</b> 기다려 → <b style="color:#c8ff2e">초록불</b> 빨리 탭 → <b style="color:#4dc9ff">파란불</b> 속지 마';
  }
  $('startSlot').addEventListener('click',startGame);
  $('retryBtn').addEventListener('click',startGame);
  $('homeBtn').addEventListener('click',function(){ show('home'); renderHomeBest(); });

  renderHomeBest();
  if(chal) startGame();
})();
</script>
</body>
</html>
